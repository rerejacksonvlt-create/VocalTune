
name: Build VocalTune VST3

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out VocalTune
        uses: actions/checkout@v4

      - name: Configure project
        run: cmake -S . -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target VocalTune_VST3

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VocalTune-Windows-VST3
          path: build/VocalTune_artefacts/Release/VST3/VocalTune.vst3
          if-no-files-found: error
